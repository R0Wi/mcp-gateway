# MCP Gateway configuration
#
# Values support environment expansion: ${VAR} or ${VAR:-default}.

server:
  # Public HTTPS URL of the gateway as seen by MCP clients (behind your
  # reverse proxy). Well-known OAuth metadata, the authorize/token endpoints
  # and the MCP endpoint (<public_url>/mcp) are all derived from this.
  public_url: https://mcp.example.com
  host: 0.0.0.0
  port: 8000
  # Peer(s) allowed to set X-Forwarded-For / X-Forwarded-Proto. Defaults to
  # loopback only, which only covers a reverse proxy running on the Docker
  # host itself. A proxy running in its own container instead (e.g.
  # jwilder/nginx-proxy on the same Docker network) connects from its
  # container IP, not 127.0.0.1 -- set this to that IP or the network's CIDR
  # (`docker network inspect <network> | grep Subnet`) so client IPs (in
  # logs, rate limiting, ...) and https detection are correct; otherwise
  # leave the default so a client can't spoof its own address.
  # trusted_proxy_ips: 127.0.0.1

auth:
  # Key used to encrypt secrets at rest (registered clients, upstream tokens).
  # Either a Fernet key or any long random passphrase. Supplied via the
  # MCP_GATEWAY_ENCRYPTION_KEY env var by default; set MCP_GATEWAY_ENCRYPTION_KEY_FILE
  # instead to read it from a file (e.g. a Docker Compose secret) -- it takes
  # precedence when set, and this line doesn't need to change either way (the
  # ":-" default below just means "don't error here if only the _FILE
  # variant is used" -- the gateway still refuses to start with no key at all).
  # See the README's "Encryption key" section for supplying, rotating, and
  # backing up this key.
  encryption_key: ${MCP_GATEWAY_ENCRYPTION_KEY:-}

  # Local users allowed to approve OAuth authorization requests.
  # Generate a hash with: mcp-gateway hash-password
  # Optional when at least one `oidc` provider below is configured.
  users:
    - username: admin
      password_hash: "$2b$12$REPLACE_ME_WITH_A_REAL_BCRYPT_HASH"
      # For quick local testing you may use a plaintext password instead:
      # password: change-me

  # Optional: sign in through external OpenID Connect providers instead of
  # (or in addition to) the local users above. Each provider shows up as a
  # "Sign in with ..." button. Register the gateway as a web application at
  # the provider with the redirect URI <public_url>/auth/oidc/<name>/callback.
  #
  # Authenticating at the provider only proves who someone is; who may use
  # the gateway is decided by the allowed_* rules (any one match admits the
  # user, case-insensitively). With none of them set you must say
  # `allow_all_users: true` explicitly.
  # oidc:
  #   # Microsoft Entra ID (Azure AD). App registration -> Authentication ->
  #   # Web platform -> redirect URI https://mcp.example.com/auth/oidc/entra/callback;
  #   # Certificates & secrets -> new client secret.
  #   entra:
  #     type: entra
  #     tenant_id: ${ENTRA_TENANT_ID}         # directory ID or verified domain
  #     client_id: ${ENTRA_CLIENT_ID}
  #     client_secret: ${ENTRA_CLIENT_SECRET}
  #     # display_name: Contoso               # button label (default "Microsoft")
  #     # username_claim: preferred_username  # default; or "email", "upn", ...
  #     # Recommended: define an app role (App roles -> "MCP.User"), assign it
  #     # to users/groups under Enterprise applications, and admit by role.
  #     allowed_roles: ["MCP.User"]
  #     # allowed_groups: ["<group object id>"]   # needs the groups claim (Token configuration)
  #     # allowed_users: ["alice@contoso.com"]
  #     # allowed_domains: ["contoso.com"]
  #     # Multi-tenant apps (tenant_id: organizations / common) must list
  #     # the tenant IDs allowed to sign in:
  #     # allowed_tenants: ["00000000-0000-0000-0000-000000000000"]
  #     # National clouds: authority_host: https://login.microsoftonline.us
  #     # extra_authorize_params: { prompt: select_account }
  #
  #   # Any standards-compliant OpenID provider (Keycloak, Authentik, Okta,
  #   # Auth0, Google, ...), discovered via <issuer>/.well-known/openid-configuration.
  #   keycloak:
  #     type: oidc
  #     display_name: Keycloak
  #     issuer: https://sso.example.com/realms/main
  #     client_id: mcp-gateway
  #     client_secret: ${KEYCLOAK_CLIENT_SECRET}
  #     # scopes: [openid, profile, email]    # default
  #     # username_claim: email               # default; "preferred_username", ...
  #     allowed_domains: ["example.com"]
  #     # allowed_groups: ["mcp-users"]       # groups_claim: groups (default)
  #     # allowed_roles: ["mcp"]
  #     # roles_claim: realm_access.roles     # dotted paths reach nested claims
  #
  # With exactly one provider and no local `users`, skip the login page and
  # go straight to the provider (opt-in). Not after a failed sign-in or an
  # explicit sign-out, which show the page with its button instead.
  # oidc_auto_redirect: true

  # Lifetimes (seconds)
  access_token_expiry_seconds: 3600
  refresh_token_expiry_seconds: 2592000   # 30 days
  login_session_expiry_seconds: 28800     # 8 hours

  # Optional allow-list of redirect URI patterns for dynamically registered
  # clients. When omitted, clients may only use the redirect URIs they
  # registered (loopback ports are allowed to vary, which is what Claude Code
  # CLI needs). Uncomment to restrict further:
  # allowed_client_redirect_uris:
  #   - "http://localhost:*/callback"
  #   - "http://127.0.0.1:*/callback"
  #   - "https://claude.ai/api/mcp/auth_callback"
  #   - "https://claude.com/api/mcp/auth_callback"

storage:
  path: /data/gateway.db

# Upstream MCP servers. Each backend's tools are exposed with the backend
# name as prefix, e.g. github_create_issue.
backends:
  # OAuth backend: the gateway runs its own OAuth client flow against the
  # backend (CIMD if supported, DCR otherwise). Connect it once via
  # <public_url>/ui/backends.
  github:
    url: https://api.githubcopilot.com/mcp/
    auth:
      type: oauth
      # scopes: ["repo"]        # optional: scopes to request
      # prefer_dcr: true        # skip CIMD even if the AS supports it
      # GitHub's authorization server supports neither CIMD nor Dynamic
      # Client Registration, so automatic discovery fails with a 404 on
      # "Connect". Register a GitHub OAuth App instead
      # (https://github.com/settings/developers), set its callback URL to
      # <public_url>/oauth/callback, and provide its credentials here:
      client_id: ${GITHUB_OAUTH_CLIENT_ID}
      client_secret: ${GITHUB_OAUTH_CLIENT_SECRET}

  # Public backend without authentication.
  microsoft-docs:
    url: https://learn.microsoft.com/api/mcp
    auth:
      type: none

  # Static bearer token (e.g. a PAT for a backend that accepts tokens directly).
  # github-pat:
  #   url: https://api.githubcopilot.com/mcp/
  #   auth:
  #     type: bearer
  #     token: ${GITHUB_PAT}

  # Arbitrary static headers (API keys etc.)
  # internal:
  #   url: https://internal.example.com/mcp
  #   auth:
  #     type: headers
  #     headers:
  #       X-API-Key: ${INTERNAL_API_KEY}
