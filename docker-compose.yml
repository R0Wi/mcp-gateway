# MCP Gateway setup
#
#   1. cp config.example.yaml config.yaml   (edit it)
#   2. export MCP_GATEWAY_ENCRYPTION_KEY=$(openssl rand -base64 32)
#   3. docker compose up -d
#
# By default this pulls the prebuilt ghcr.io/r0wi/mcp-gateway:latest image --
# no build step required. To build from source instead (e.g. to test local
# changes), comment out the `image:` line below and uncomment `build: .`.
#
# The encryption key can instead be supplied as a Docker Compose secret file
# (recommended for production -- keeps the key out of `docker inspect` /
# `docker compose config` output; see the README's "Encryption key" section,
# https://docs.docker.com/compose/how-tos/use-secrets/ and
# https://phase.dev/blog/docker-compose-secrets/). To switch:
#   1. openssl rand -base64 32 > secrets/encryption_key   (chmod 400 it)
#   2. comment out the MCP_GATEWAY_ENCRYPTION_KEY line below and uncomment
#      MCP_GATEWAY_ENCRYPTION_KEY_FILE, the service's `secrets:` list, and
#      the top-level `secrets:` block
#   The service's `secrets:` entry below uses the long syntax to mount the
#   file as uid/gid 10001 (the container's non-root `gateway` user; see
#   Dockerfile) with mode 0400, instead of Docker's default 0444 root:root --
#   so only that user can read it inside the container.
services:
  mcp-gateway:
    image: ghcr.io/r0wi/mcp-gateway:latest
    # Uncomment to build from source instead of pulling the published image:
    # build: .
    restart: unless-stopped
    environment:
      # secret referenced from config.yaml via ${...}
      MCP_GATEWAY_ENCRYPTION_KEY: ${MCP_GATEWAY_ENCRYPTION_KEY:?set MCP_GATEWAY_ENCRYPTION_KEY}
      # Alternative to the env var above: a Docker Compose secret file (see
      # the header comment). Set alongside a `secrets:` entry below; it
      # takes precedence over MCP_GATEWAY_ENCRYPTION_KEY when set.
      # MCP_GATEWAY_ENCRYPTION_KEY_FILE: /run/secrets/encryption_key
      # needed if config.yaml has an upstream using GitHub OAuth
      # GITHUB_OAUTH_CLIENT_ID: ${GITHUB_OAUTH_CLIENT_ID:?set GITHUB_OAUTH_CLIENT_ID}
      # GITHUB_OAUTH_CLIENT_SECRET: ${GITHUB_OAUTH_CLIENT_SECRET:?set GITHUB_OAUTH_CLIENT_SECRET}
      # needed if config.yaml logs users in through an OIDC provider (auth.oidc)
      # OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:?set OIDC_CLIENT_ID}
      # OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:?set OIDC_CLIENT_SECRET}
      # log verbosity: debug, info, warning, error, critical (default: info)
      MCP_GATEWAY_LOG_LEVEL: ${MCP_GATEWAY_LOG_LEVEL:-info}
    volumes:
      - ./config.yaml:/config/config.yaml:ro
      - gateway-data:/data
    ports:
      - "8000:8000"
    # secrets:
    #   - source: encryption_key
    #     target: encryption_key
    #     uid: "10001"
    #     gid: "10001"
    #     mode: 0400

volumes:
  gateway-data:

