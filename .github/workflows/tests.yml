name: Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: ui/package-lock.json

      - name: Build UI
        # test_ui_static.py serves the built Svelte app, so it needs to
        # exist before pytest runs -- see ui/vite.config.js's outDir.
        run: |
          npm ci
          npm run build
        working-directory: ui

      - name: Run pytest
        run: pytest

  ruff:
    # Independent of the pytest job above, so lint results come back without
    # waiting on the UI build and the e2e OAuth suite.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install ruff
        # Just the linter -- this job needs none of the runtime dependencies.
        # Constraint mirrors the `dev` extra in pyproject.toml; keep them in sync.
        run: pip install "ruff>=0.16.4"

      - name: Run ruff
        # Lint only. `ruff format --check` is deliberately not run: the tree is
        # not currently format-clean, and reformatting it is a separate change.
        run: ruff check --output-format=github .
