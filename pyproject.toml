[project]
name = "mcp-gateway"
version = "0.1.0"
description = "Self-hosted MCP aggregator gateway with a spec-compliant client-facing OAuth 2.1 authorization server (DCR + CIMD + PKCE)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastmcp>=3.4.7,<4",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.4",
    "pyyaml>=6.0.3",
    "cryptography>=50.0.0",
    "bcrypt>=5.0.0",
    "itsdangerous>=2.2.0",
    "httpx>=0.28.1",
    "alembic>=1.19.1",
    "sqlalchemy>=2.0.52",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.4",
]

[project.scripts]
mcp-gateway = "mcp_gateway.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_gateway"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
