<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <!-- Single source of truth for the mark: ui/public/favicon.svg, copied
         verbatim to the build output and also read at runtime by the Python
         backend (mcp_gateway.gateway) to advertise the same icon in the MCP

         here as an inline data URI. -->
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <title>MCP Gateway</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
